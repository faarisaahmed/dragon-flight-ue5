; "Cinematic" (level 4) is what the in-game Max preset selects. These push
; past Epic's stock cinematic where it matters for a huge open world.
[ViewDistanceQuality@4]
r.SkeletalMeshLODBias=-1
r.ViewDistanceScale=4.0
r.StaticMeshLODDistanceScale=0.5

[FoliageQuality@4]
foliage.DensityScale=1.0
grass.DensityScale=1.0
foliage.LODDistanceScale=3.0
grass.CullDistanceScale=2.0

[ShadowQuality@4]
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.5
r.Shadow.Virtual.SMRT.RayCountDirectional=16
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=8

[GlobalIlluminationQuality@4]
r.Lumen.ScreenProbeGather.DownsampleFactor=8
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=16
r.Lumen.TraceDistanceScale=2.0

[EffectsQuality@4]
r.VolumetricCloud.ViewRaySampleMaxCount=1024
r.VolumetricCloud.ReflectionRaySampleMaxCount=80
r.VolumetricCloud.ShadowViewRaySampleMaxCount=192
r.VolumetricFog.GridPixelSize=4
r.VolumetricFog.GridSizeZ=128
